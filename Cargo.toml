[package]
name = "moniteur-ia"
version = "0.4.5"
edition = "2024"

[dependencies]
egui = { version = "=0.34.3", default-features = false, features = ["default_fonts"] }
egui_software_backend = "=0.0.3"
nvml-wrapper = "=0.13.0"
serde_json = "1.0.154"
sysinfo = { version = "=0.40.4", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Performance", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
